name: Benchmark

# Benchmarks the pull request against main on the same runner with
# AirspeedVelocity.jl, using benchmark/benchmarks.jl from the pull request,
# and writes the comparison table to the job summary.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "examples/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          job-summary: 'true'
